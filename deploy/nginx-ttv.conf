# ── 理论文章转视频(/ttv/)── 追加进 /etc/nginx/sites-enabled/comfyui-20013 的 server 块
# 注意:必须在 location / 之前(更长前缀优先级高于 /,顺序不影响,但为可读性放前面)
# 本文件通过 include /etc/nginx/ttv-locations.conf; 引入
#
# 配套配置(放在 http{} 上下文,一次性):
#   limit_req_zone $binary_remote_addr zone=ttv_api:10m rate=10r/s;
# 20013 的 server 块内建议补 gzip 类型与代理压缩:
#   gzip_types text/plain text/css application/javascript application/json image/svg+xml;
#   gzip_proxied any;
#   gzip_min_length 1k;

    # 后端 API(含 HyperFrames Studio 反向代理)
    location /ttv/api/ {
        auth_basic off;
        client_max_body_size 30M;
        # 公网无鉴权:简单限流,防批量提交耗尽 LLM/GPU 配额
        limit_req zone=ttv_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8015/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # 前端静态页(上传页 + 预览二级页)
    location /ttv/ {
        auth_basic off;
        alias /mnt/workspace/ttv/web/;
        index index.html;
        # index.html 短缓存(更新后 60s 内生效,避免改动被浏览器旧缓存卡住)
        location = /ttv/index.html {
            add_header Cache-Control "no-cache";
        }
    }

    # 共享资产(字体/BGM/vendor):内容不可变,一年长缓存
    location /ttv/assets/ {
        auth_basic off;
        alias /mnt/workspace/ttv/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }
