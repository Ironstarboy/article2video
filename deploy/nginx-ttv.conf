# ── 理论文章转视频(/ttv/)── 追加进 /etc/nginx/sites-enabled/comfyui-20013 的 server 块
# 注意:必须在 location / 之前(更长前缀优先级高于 /,顺序不影响,但为可读性放前面)
# 本文件通过 include /etc/nginx/ttv-locations.conf; 引入

    # 后端 API(含 HyperFrames 播放器反向代理)
    location /ttv/api/ {
        auth_basic off;
        client_max_body_size 30M;
        proxy_pass http://127.0.0.1:8015/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    # 前端静态页(上传页 + 预览二级页)
    location /ttv/ {
        auth_basic off;
        alias /mnt/workspace/ttv/web/;
        index index.html;
    }
